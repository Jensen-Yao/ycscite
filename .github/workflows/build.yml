name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - name: Chinese fonts for Linux rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Java tests (Linux)
        if: runner.os == 'Linux'
        run: bash build.sh
      - name: Java tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd
      - name: Rust tests
        run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Native build
        run: cargo build --release --manifest-path native/Cargo.toml --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CLI and headless smoke
        shell: bash
        run: python tools/smoke-product.py --cli "native/target/release/ycscite${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Editor settings and saved projects
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/smoke-editor.py --cli native/target/release/ycscite.exe
      - name: Workspace persistence and recovery
        shell: bash
        run: python tools/smoke-workspace.py --cli "native/target/release/ycscite${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-windows.ps1 -SkipBuild
      - name: Verify packaged app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --manifest-path native/Cargo.toml --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          python tools/smoke-product.py --cli "dist/Ycscite-$version-windows-x64/ycscite-cli.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/smoke-workspace.py --cli "dist/Ycscite-$version-windows-x64/ycscite-cli.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/smoke-editor.py --cli "dist/Ycscite-$version-windows-x64/ycscite-cli.exe"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Ycscite-windows-x64
          path: |
            dist/Ycscite-*-windows-x64.zip
            dist/Ycscite-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
