[package]
name = "ycscite-client"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Local bibliometric workbench with CLI, headless NDJSON, Web and desktop"
default-run = "ycscite"

[lib]
name = "ycscite_client"

[[bin]]
name = "ycscite"
path = "src/main.rs"

[[bin]]
name = "ycscite-desktop"
path = "src/bin/desktop.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny_http = "0.12"
rand = "0.9"
base64 = "0.22"
webbrowser = "1"
ctrlc = "3.5"

[target.'cfg(windows)'.dependencies]
rfd = "0.18"
wry = "0.57"
tao = "0.37"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
